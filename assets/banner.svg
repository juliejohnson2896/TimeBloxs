<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1280" height="320" fill="#0F0F14"/>
  
  <!-- Subtle grid lines -->
  <line x1="0" y1="80" x2="1280" y2="80" stroke="#1A1A24" stroke-width="1"/>
  <line x1="0" y1="160" x2="1280" y2="160" stroke="#1A1A24" stroke-width="1"/>
  <line x1="0" y1="240" x2="1280" y2="240" stroke="#1A1A24" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="320" stroke="#1A1A24" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="320" stroke="#1A1A24" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="320" stroke="#1A1A24" stroke-width="1"/>

  <!-- Mini icon -->
  <rect x="60" y="100" width="120" height="120" rx="24" fill="#1A1A24"/>
  <rect x="60" y="100" width="120" height="120" rx="24" fill="none" stroke="#24243A" stroke-width="1"/>
  <!-- Mini blocks inside icon -->
  <rect x="76" y="118" width="36" height="14" rx="3" fill="#6C63FF" opacity="0.4"/>
  <rect x="120" y="118" width="44" height="14" rx="3" fill="#6C63FF" opacity="0.9"/>
  <rect x="76" y="138" width="60" height="14" rx="3" fill="#6C63FF" opacity="0.9"/>
  <rect x="144" y="138" width="30" height="14" rx="3" fill="#6C63FF" opacity="0.4"/>
  <rect x="76" y="158" width="30" height="14" rx="3" fill="#6C63FF" opacity="0.4"/>
  <rect x="114" y="158" width="60" height="14" rx="3" fill="#6C63FF"/>
  <rect x="76" y="178" width="44" height="14" rx="3" fill="#6C63FF" opacity="0.9"/>
  <rect x="128" y="178" width="36" height="14" rx="3" fill="#6C63FF" opacity="0.4"/>

  <!-- App name -->
  <text x="208" y="152" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#EEEEFF" letter-spacing="-2">Timebloxs</text>
  
  <!-- Tagline -->
  <text x="210" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#9999BB" letter-spacing="0.5">Fluid time blocking for the way you actually work</text>

  <!-- Badges row -->
  <!-- Android badge -->
  <rect x="210" y="224" width="110" height="32" rx="6" fill="#24243A"/>
  <text x="225" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#6C63FF">📱 Android</text>

  <!-- Windows badge -->
  <rect x="330" y="224" width="110" height="32" rx="6" fill="#24243A"/>
  <text x="345" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#6C63FF">🖥️ Windows</text>

  <!-- Offline badge -->
  <rect x="450" y="224" width="130" height="32" rx="6" fill="#24243A"/>
  <text x="465" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#6C63FF">☁️ Offline First</text>

  <!-- Open Source badge -->
  <rect x="590" y="224" width="130" height="32" rx="6" fill="#24243A"/>
  <text x="605" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#6C63FF">⚡ Open Source</text>

  <!-- Decorative blocks on right side -->
  <rect x="920" y="40" width="120" height="36" rx="8" fill="#6C63FF" opacity="0.15"/>
  <rect x="1056" y="40" width="180" height="36" rx="8" fill="#6C63FF" opacity="0.4"/>
  <rect x="920" y="88" width="200" height="36" rx="8" fill="#6C63FF" opacity="0.4"/>
  <rect x="1136" y="88" width="100" height="36" rx="8" fill="#6C63FF" opacity="0.15"/>
  <rect x="920" y="136" width="100" height="36" rx="8" fill="#6C63FF" opacity="0.15"/>
  <rect x="1036" y="136" width="200" height="36" rx="8" fill="#6C63FF"/>
  <rect x="920" y="184" width="160" height="36" rx="8" fill="#6C63FF" opacity="0.4"/>
  <rect x="1096" y="184" width="140" height="36" rx="8" fill="#6C63FF" opacity="0.15"/>
  <rect x="920" y="232" width="100" height="36" rx="8" fill="#6C63FF" opacity="0.9"/>
  <rect x="1036" y="232" width="120" height="36" rx="8" fill="#6C63FF" opacity="0.15"/>
  <rect x="1172" y="232" width="64" height="36" rx="8" fill="#6C63FF" opacity="0.4"/>

  <!-- Time axis line -->
  <rect x="904" y="40" width="3" height="228" rx="1" fill="#6C63FF" opacity="0.3"/>
</svg>
