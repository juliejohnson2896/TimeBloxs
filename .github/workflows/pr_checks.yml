name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ── Code Quality ─────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

  # ── Tests & Coverage ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Filter coverage report
        run: |
          # Exclusions are defined in lcovrc at project root
          # This file is version controlled and subject to PR review
          # Modifying it is visible in diffs — not easily bypassed silently
          lcov --config-file lcovrc \
               --remove coverage/lcov.info \
               'lib/core/database/tables/*' \
               'lib/core/theme/app_theme.dart' \
               'lib/**/*.g.dart' \
               'lib/core/services/pocketbase_service.dart' \
               'lib/core/services/auth_notifier.dart' \
               'lib/core/router/app_router.dart' \
               'lib/main.dart' \
               --ignore-errors unused \
               -o coverage/filtered_lcov.info

      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/filtered_lcov.info 2>&1 \
            | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Coverage: $COVERAGE%"

          THRESHOLD=40
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage $COVERAGE% is below threshold of $THRESHOLD%"
            echo "Increase test coverage or update threshold in pr_checks.yml"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets threshold of $THRESHOLD%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/filtered_lcov.info

  # ── Android Build Check ──────────────────────────────────────
  # Only runs on PRs targeting main — keeps develop PRs fast
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    if: github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

  # ── Windows Build Check ──────────────────────────────────────
  # Only runs on PRs targeting main — keeps develop PRs fast
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    if: github.base_ref == 'main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug Windows
        run: flutter build windows --debug