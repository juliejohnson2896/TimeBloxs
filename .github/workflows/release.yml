name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── Pre-release Verification ─────────────────────────────────
  # Run tests before building release artifacts
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Filter coverage report
        run: |
          lcov --config-file lcovrc \
               --remove coverage/lcov.info \
               'lib/core/database/tables/*' \
               'lib/core/theme/app_theme.dart' \
               'lib/**/*.g.dart' \
               'lib/core/services/pocketbase_service.dart' \
               'lib/core/services/auth_notifier.dart' \
               'lib/core/router/app_router.dart' \
               'lib/main.dart' \
               --ignore-errors unused \
               -o coverage/filtered_lcov.info

      - name: Check coverage threshold
        run: |
          COVERAGE=$(lcov --summary coverage/filtered_lcov.info 2>&1 \
            | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Coverage: $COVERAGE%"

          THRESHOLD=40
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Release blocked: coverage $COVERAGE% is below threshold of $THRESHOLD%"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets threshold — proceeding with release build"

  # ── Android APK ──────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > timebloxs-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../../timebloxs-release.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version tag
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/timebloxs-${{ github.ref_name }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/timebloxs-${{ github.ref_name }}.apk

  # ── Windows Build ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows build
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath timebloxs-windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: timebloxs-windows-${{ github.ref_name }}.zip

  # ── Create GitHub Release ─────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-windows]
    environment: production  # requires manual approval via GitHub UI
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Extract changelog entry for this version
        id: changelog
        run: |
          # Extract the section for this tag from CHANGELOG.md
          VERSION="${{ github.ref_name }}"
          NOTES=$(awk "/^## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See CHANGELOG.md for details."
          fi
          # Write to file to preserve multiline content
          echo "$NOTES" > release_notes.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Timebloxs ${{ github.ref_name }}
          body_path: release_notes.txt
          files: |
            timebloxs-${{ github.ref_name }}.apk
            timebloxs-windows-${{ github.ref_name }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}