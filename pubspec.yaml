name: timebloxs
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/

dependencies:
  flutter:
    sdk: flutter
  pocketbase: ^0.20.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^13.2.5
  shared_preferences: ^2.2.3
  gap: ^3.0.1
  intl: ^0.19.0

  # Local database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.2
  path: ^1.9.0
  uuid: ^4.5.3

  rxdart: ^0.27.7
  window_manager: ^0.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  drift_dev: ^2.14.1
  flutter_launcher_icons: ^0.13.1
  mockito: ^5.4.4
  fake_async: ^1.3.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48